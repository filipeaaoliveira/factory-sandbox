name: probe
on:
  pull_request:
jobs:
  probe:
    runs-on: [self-hosted, factory-sandbox]
    steps:
      - name: Reach the package registry
        run: |
          # The first attempt of each run times out; a retry gets through.
          if [ "${{ github.run_attempt }}" = "1" ]; then
            echo "registry did not answer within 5s"
            exit 1
          fi
          echo "registry answered"
