name: test
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: [self-hosted, factory-sandbox]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Mark main red while .ci/fail-on-main exists
        if: github.event_name == 'push' && hashFiles('.ci/fail-on-main') != ''
        run: |
          echo "::error::.ci/fail-on-main exists: main's test is red on purpose"
          exit 1
